name: Deploy to GitHub Pages

# Every push to main is checked and, only if every check passes, published. A failing step ends
# the job, so a commit whose content or code fails a check never reaches the site (EPIC-260007).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels an older run still in progress; the newest commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Unit and component tests, including the content check over content/.
      - name: Tests with coverage
        run: npm run test:coverage

      # GITHUB_SHA is set here, so the footer's build id names this commit.
      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the dist/ built above (served under a sub-path); it does not rebuild. With
      # GITHUB_SHA set here too, it fails a build whose footer does not name this commit.
      - name: End-to-end check
        id: e2e
        run: npm run test:e2e

      - name: Upload the end-to-end report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/configure-pages@v6
        with:
          enablement: false

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
